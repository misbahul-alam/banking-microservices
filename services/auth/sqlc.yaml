version: "2"

sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/database/queries"

    gen:
      go:
        package: "sqlc"
        out: "internal/database/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
